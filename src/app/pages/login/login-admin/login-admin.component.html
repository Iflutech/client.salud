<div nz-row style="min-height: 100vh;">
  <div class="login-image-container" nz-col nzXs="0" nzSm="0" nzMd="0" nzLg="12" nzXl="12">
    <div style="display: flex; gap: 20px;">
      <img class="login-logo" src="../../../../assets/iflutech.webp" alt="Logo Iflutech">
      <!--<img class="login-one-team" src="../../../assets/oneteam.webp" alt="oneTeam logo"> -->
    </div>
    <img class="login-image" src="../../../../assets/login_image.svg" alt="Login" >
  </div>
  <div class="login-container" nz-col nzXs="24" nzSm="24" nzMd="24" nzLg="12" nzXl="12">
    <h2 nz-typography style="color: white; padding-bottom: 20px;">Verificación de identidad</h2>
    <form nz-form [formGroup]="loginForm" class="login-form" (ngSubmit)="login(loginForm.value)">
      <nz-form-item>
        <nz-form-control nzErrorTip="Ingrese su usuario">
          <nz-input-group nzPrefixIcon="user">
            <input type="text" nz-input formControlName="username" placeholder="Usuario" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control nzErrorTip="Ingrese su contraseña">
          <nz-input-group [nzPrefix]="prefixTemplateUser" [nzSuffix]="suffixTemplate">
            <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="password" placeholder="Contraseña" />
          </nz-input-group>
          <ng-template #prefixTemplateUser><span nz-icon nzType="lock"></span></ng-template>
          <ng-template #suffixTemplate>
            <span
              nz-icon
              [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
              (click)="passwordVisible = !passwordVisible"
            ></span>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <button nz-button class="login-form-button login-form-margin" 
        [nzLoading]="isLoadingLoading" [nzType]="'primary'">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
